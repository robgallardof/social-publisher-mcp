[project]
name = "social-forge"
version = "0.1.0"
description = "Community-manager MCP: dated video queue, per-platform copy, 05:00 publishing to TikTok, Reels, Facebook and Shorts, metrics."
requires-python = ">=3.12,<3.14"
dependencies = ["mcp[cli]>=1.30,<2", "httpx>=0.27", "pyyaml>=6", "tzdata>=2024.1", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2"]
browser = ["playwright>=1.48"]
# transcripts and subtitles (CPU int8 by default)
analysis = ["faster-whisper>=1.1", "numpy>=1.26"]

[project.scripts]
social-forge = "social_forge.cli:main"
social-forge-mcp = "social_forge.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
