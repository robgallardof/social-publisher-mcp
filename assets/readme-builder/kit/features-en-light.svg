<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="616" viewBox="0 0 1200 616" role="img" aria-label="Dated queue: A day folder goes out that day: three videos, three posts at 05:00. Week folders spread on their own. · Watches every video: 8 frames and a transcript: what happens, speech, burned-in text. · Per-platform copy: Hook, body, CTA and hashtags checked against each platform&#x27;s real limits. · Cross-promotion: Every caption ends with your handles on the other networks. · Subtitles: None, platform auto, .srt or burned in, styled for vertical video. · Any way it can: Official APIs, Postiz, a browser profile, or the agent itself. · Every day: A scheduled task with retries; it catches up if the PC was off. · Learns: Best days, top and bottom videos, a weekly report with three actions at most." data-readme-component="bento"><title>Dated queue: A day folder goes out that day: three videos, three posts at 05:00. Week folders spread on their own. · Watches every video: 8 frames and a transcript: what happens, speech, burned-in text. · Per-platform copy: Hook, body, CTA and hashtags checked against each platform&#x27;s real limits. · Cross-promotion: Every caption ends with your handles on the other networks. · Subtitles: None, platform auto, .srt or burned in, styled for vertical video. · Any way it can: Official APIs, Postiz, a browser profile, or the agent itself. · Every day: A scheduled task with retries; it catches up if the PC was off. · Learns: Best days, top and bottom videos, a weekly report with three actions at most.</title><defs><linearGradient id="kb" x2="1" y2="0"><stop stop-color="#f97316"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb7185"/></linearGradient><linearGradient id="kbd" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',In